data,
              count=1,
              flags=re.MULTILINE | re.DOTALL
          )

          if count != 1:
              raise SystemExit(
                  "Cannot locate Host/Compile block"
              )

          path.write_text(data)

          print("Host/Compile compatibility fix applied")
          PY

          ############################################
          # 11.4 Remove incompatible legacy OpenSSL patch
          ############################################
          echo "Remove incompatible OpenSSL legacy patch"

          rm -f \
            "$WORKDIR/softethervpn/patches/120-openssl-deprecated.patch"

          ############################################
          # 11.5 Verify final package recipe
          ############################################
          echo "===== SoftEtherVPN package version ====="

          grep -E \
            '^PKG_(VERSION|VERREL|RELEASE|SOURCE_URL|HASH):=' \
            "$WORKDIR/softethervpn/Makefile"

          echo "===== SoftEtherVPN Host compile block ====="

          sed -n \
            '/^define Host\/Compile$/,/^endef$/p' \
            "$WORKDIR/softethervpn/Makefile"

          echo "===== SoftEtherVPN remaining patches ====="

          ls -la "$WORKDIR/softethervpn/patches/"

          if [ -f "$WORKDIR/softethervpn/patches/120-openssl-deprecated.patch" ]; then
              echo "ERROR: incompatible OpenSSL patch still exists"
              exit 1
          fi

          echo "SoftEtherVPN 4.44 package recipe prepared successfully"

          cd "$WORKDIR"
          
          ############################################
          # Remove embedded Git repositories
          ############################################
          cd "$WORKDIR"
          find . -mindepth 2 -name ".git" -type d -prune -exec rm -rf {} +

          ############################################
          # Generate README
          ############################################
          printf '%s\n' \
            '# OpenWrt Third-Party Packages Mirror' \
            '' \
            'This repository syncs selected OpenWrt third-party packages for personal builds.' \
            '' \
            '## Included packages' \
            '' \
            '- luci-theme-argon' \
            '- luci-app-autoreboot' \
            '- luci-app-arpbind' \
            '- luci-app-openvpn-server' \
            '- luci-app-vlmcsd' \
            '- vlmcsd' \
            '- luci-app-ramfree' \
            '- luci-app-softethervpn' \
            '- luci-app-openclash' \
            '- fw876/helloworld packages' \
            '- softethervpn (4.44-9807 RTM; OpenWrt 24.10 build tested)' \
            '' \
            '## Usage' \
            '' \
            'Add this feed to feeds.conf.default:' \
            '' \
            '```text' \
            'src-git mypackages https://github.com/liuxindavid/openwrt-third-party-packages.git;main' \
            '```' \
            '' \
            'Then run:' \
            '' \
            '```bash' \
            './scripts/feeds update mypackages' \
            './scripts/feeds install -a -p mypackages' \
            '```' \
            '' \
            '## Notes' \
            '' \
            '- The luci-app-autoreboot Makefile is overridden for compatibility.' \
            '- fw876/helloworld packages are synced into the feed root.' \
            '- SoftEtherVPN 4.44 uses the OpenWrt 24.10 recipe with an Ubuntu 26.04.1 x86_64 Host build workaround.' \
            '- It is NOT automatically selected over the official softethervpn package.' \
            '- Verify host and target builds, LuCI start/stop and L2TP/IPsec before deployment.' \
            '- The SoftEtherVPN package may need version-specific patches.' \
            '' \
            'Synced automatically by GitHub Actions.' \
            > README.md

          echo "===== Synced package directories ====="
          ls -la
          echo "===== SoftEtherVPN recipe ====="
          grep -E '^PKG_(VERSION|VERREL|RELEASE|SOURCE|SOURCE_URL|HASH)' \
            "$WORKDIR/softethervpn/Makefile"

          git status
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync OpenWrt third-party packages"
            git push origin HEAD:main
          fi
